name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    name: Convention scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test scripts/conventions/conventions.test.cjs
      - name: Config is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('scripts/conventions/project-config.json','utf8'))"
