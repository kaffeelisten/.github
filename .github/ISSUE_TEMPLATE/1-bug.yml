name: Bug report
description: Something behaves differently from how it should
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never include real people's names, a PIN, a key or a token** — not in text, not in a
        screenshot, not in a log excerpt. Replace them with placeholders.

        A security vulnerability does not belong here. Use the Security tab, as described in
        [SECURITY.md](https://github.com/kaffeelisten/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the member flow
        2. Select a company, then a member
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where in the product
      options:
        - Member flow (company, member, item, confirm)
        - Admin panel
        - Monthly report or archive
        - Billing documents
        - Installation or PWA behaviour
        - Somewhere else, or not sure
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging or a preview deployment
        - Local development
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and browser
      description: The tablet by the machine behaves differently from a laptop, so this matters.
      placeholder: iPad, Safari 18, installed as a PWA
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console or network output
      description: Any error text, with names and secrets removed.
      render: text

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: This contains no real member names, PINs, keys or tokens.
          required: true
        - label: I searched the existing issues.
          required: true
